<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Request Profile Update</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('employee_dashboard') }}"
        >
            Employee Management System
        </a>

        <div>

            <a
                href="{{ url_for('my_profile') }}"
                class="btn btn-secondary me-2"
            >
                My Profile
            </a>

            <a
                href="{{ url_for('logout') }}"
                class="btn btn-danger"
            >
                Logout
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-2">
                Request Profile Update
            </h2>

            <p class="text-muted">
                Submit a request to update your personal information.
            </p>


            <form
                method="POST"
                class="mt-4"
            >

                <!-- Field -->

                <div class="mb-3">

                    <label class="form-label">
                        Information to Update
                    </label>

                    <select
                        name="field"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select field
                        </option>

                        <option value="name">
                            Full Name
                        </option>

                        <option value="email">
                            Email
                        </option>

                        <option value="phone">
                            Phone
                        </option>

                        <option value="age">
                            Age
                        </option>

                    </select>

                </div>


                <!-- New Value -->

                <div class="mb-3">

                    <label class="form-label">
                        New Value
                    </label>

                    <input
                        type="text"
                        name="new_value"
                        class="form-control"
                        placeholder="Enter new value"
                        required
                    >

                </div>


                <!-- Reason -->

                <div class="mb-3">

                    <label class="form-label">
                        Reason
                    </label>

                    <textarea
                        name="reason"
                        class="form-control"
                        rows="4"
                        placeholder="Why do you want to update this information?"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Submit Request
                </button>

                <a
                    href="{{ url_for('my_profile') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
