<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply Leave</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">Apply for Leave</h4>
        </div>

        <div class="card-body">

            <form method="POST">

                <!-- Leave Type -->
                <div class="mb-3">
                    <label class="form-label">Leave Type</label>

                    <select
                        name="leave_type"
                        class="form-select"
                        required
                    >
                        <option value="">Select Leave Type</option>

                        {% for balance in leave_balances %}

                            <option value="{{ balance.leave_type }}">
                                {{ balance.leave_type }}
                                -
                                {{ balance.total_days - balance.used_days }}
                                days remaining
                            </option>

                        {% endfor %}

                    </select>
                </div>

                <!-- From Date -->
                <div class="mb-3">
                    <label class="form-label">From Date</label>

                    <input
                        type="date"
                        name="from_date"
                        class="form-control"
                        required
                    >
                </div>

                <!-- To Date -->
                <div class="mb-3">
                    <label class="form-label">To Date</label>

                    <input
                        type="date"
                        name="to_date"
                        class="form-control"
                        required
                    >
                </div>

                <div
                id="leaveWarning"
                class="alert alert-warning mt-3 d-none"
            >
            </div>

            <div
                id="leaveDuration"
                class="text-muted mt-2"
            >
            </div>

                <!-- Reason -->
                <div class="mb-3">
                    <label class="form-label">Reason</label>

                    <textarea
                        name="reason"
                        class="form-control"
                        rows="4"
                        placeholder="Enter reason for leave"
                        required
                    ></textarea>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Submit Leave Request
                </button>

            </form>

        </div>

        <a
            href="{{ url_for('employee_dashboard') }}"
            class="btn btn-outline-primary"
        >
            ← Back to Dashboard
        </a>
        
    </div>

</div>

<script>

    const leaveTypeSelect =
        document.querySelector(
            'select[name="leave_type"]'
        );

    const fromDateInput =
        document.querySelector(
            'input[name="from_date"]'
        );

    const toDateInput =
        document.querySelector(
            'input[name="to_date"]'
        );

    const leaveWarning =
        document.getElementById(
            "leaveWarning"
        );

    const leaveBalances = {

        {% for balance in leave_balances %}

        "{{ balance.leave_type }}":
            {{ balance.total_days - balance.used_days }},

        {% endfor %}

    };

    function checkLeaveDays() {

        const leaveType =
            leaveTypeSelect.value;

        const fromDate =
            fromDateInput.value;

        const toDate =
            toDateInput.value;

        leaveWarning.classList.add("d-none");
        leaveDuration.textContent = "";

        if (
            !leaveType ||
            !fromDate ||
            !toDate
        ) {
            return;
        }

        const start =
            new Date(fromDate);

        const end =
            new Date(toDate);

        if (end < start) {
            return;
        }

        const millisecondsPerDay =
            1000 * 60 * 60 * 24;

        const leaveDays =
            Math.round(
                (end - start) /
                millisecondsPerDay
            ) + 1;

        const remainingDays =
            leaveBalances[leaveType];
        
        leaveDuration.textContent =
            `Leave Duration: ${leaveDays} day(s)`;

        if (leaveDays > remainingDays) {

            leaveWarning.textContent =
                `You can apply for a maximum of ${remainingDays} days of ${leaveType}.`;

            leaveWarning.classList.remove(
                "d-none"
            );

        }

    }

    leaveTypeSelect.addEventListener(
        "change",
        checkLeaveDays
    );

    fromDateInput.addEventListener(
        "change",
        checkLeaveDays
    );

    toDateInput.addEventListener(
        "change",
        checkLeaveDays
    );

</script>

</body>
</html>
