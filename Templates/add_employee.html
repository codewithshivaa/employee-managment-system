<!DOCTYPE html>
<html>
<head>

    <title>Add Employee</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">
    {% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        {% for category, message in messages %}

            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">

                {{ message }}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>

        {% endfor %}

    {% endif %}

{% endwith %}

<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Employee Management System
        </a>

        <a href="/employees" class="btn btn-outline-light">
            View Employees
        </a>

    </div>

</nav>


<!-- Form -->

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Add New Employee
            </h2>

            <form method="POST">

                <div class="row g-3">

                    <!-- Name -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter employee name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="example@gmail.com"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <!-- Age -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            placeholder="Enter age"
                            required
                        >

                    </div>


                    <!-- Department -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Department
                        </label>

                        <select name="department" class="form-select" required>

    <option value="">Select Department</option>

    <option value="IT">IT</option>
    <option value="HR">HR</option>
    <option value="Finance">Finance</option>
    <option value="Account">Account</option>
    <option value="Sales">Sales</option>
    <option value="Marketing">Marketing</option>

</select>

                    </div>


                    <!-- Designation -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Designation
                        </label>

                        <input
                            type="text"
                            name="designation"
                            class="form-control"
                            placeholder="Python Developer..."
                            required
                        >

                    </div>


                    <!-- Salary -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Salary
                        </label>

                        <input
                            type="number"
                            name="salary"
                            class="form-control"
                            placeholder="Enter salary"
                            required
                        >

                    </div>


                    <!-- Joining Date -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            name="joining_date"
                            class="form-control"
                            required
                        >

                    </div>
                    <div class="mb-3">

    <label class="form-label">
        Employee Status
    </label>

    <select
        name="status"
        class="form-select"
        required
    >

        <option value="Active">
            Active
        </option>

        <option value="Inactive">
            Inactive
        </option>

    </select>

</div>

                </div>


                <!-- Buttons -->

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Employee
                    </button>

                    <a
                        href="/employees"
                        class="btn btn-secondary ms-2"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
