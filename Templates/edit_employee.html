<!DOCTYPE html>
<html>
<head>

    <title>Edit Employee</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Employee Management System
        </a>

        <a href="/employees" class="btn btn-outline-light">
            View Employees
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Edit Employee
            </h2>

            <form method="POST">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ employee.name }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ employee.email }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ employee.phone }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            value="{{ employee.age }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Department
                        </label>
<select name="department" class="form-select" required>

    <option value="">Select Department</option>

    <option value="IT"
        {% if employee.department == "IT" %}selected{% endif %}>
        IT
    </option>

    <option value="HR"
        {% if employee.department == "HR" %}selected{% endif %}>
        HR
    </option>

    <option value="Finance"
        {% if employee.department == "Finance" %}selected{% endif %}>
        Finance
    </option>

    <option value="Account"
        {% if employee.department == "Account" %}selected{% endif %}>
        Account
    </option>

    <option value="Sales"
        {% if employee.department == "Sales" %}selected{% endif %}>
        Sales
    </option>

    <option value="Marketing"
        {% if employee.department == "Marketing" %}selected{% endif %}>
        Marketing
    </option>

</select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Designation
                        </label>

                        <input
                            type="text"
                            name="designation"
                            class="form-control"
                            value="{{ employee.designation }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Salary
                        </label>

                        <input
                            type="number"
                            name="salary"
                            class="form-control"
                            value="{{ employee.salary }}"
                            required
                        >

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            name="joining_date"
                            class="form-control"
                            value="{{ employee.joining_date }}"
                            required
                        >

                    </div>

                    <div class="mb-3">

    <label class="form-label">
        Employee Status
    </label>

    <select
        name="status"
        class="form-select"
        required
    >

        <option
            value="Active"
            {% if employee.status == "Active" %}
                selected
            {% endif %}
        >
            Active
        </option>

        <option
            value="Inactive"
            {% if employee.status == "Inactive" %}
                selected
            {% endif %}
        >
            Inactive
        </option>

    </select>

</div>  

                </div>


                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Update Employee
                    </button>

                    <a
                        href="/employees"
                        class="btn btn-secondary ms-2"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
