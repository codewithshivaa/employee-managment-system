<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Employee Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-dark text-white">

                    <h4 class="mb-0">
                        Create Employee Account
                    </h4>

                </div>

                <div class="card-body">

                    {% with messages = get_flashed_messages(
                        with_categories=true
                    ) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div
                                    class="alert alert-{{ category }}"
                                >
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <form
                        method="POST"
                    >

                        <!-- Employee -->

                        <div class="mb-3">

                            <label class="form-label">
                                Select Employee
                            </label>

                            <select
                                name="employee_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Employee
                                </option>

                                {% for employee in employees %}

                                    <option
                                        value="{{ employee.id }}"
                                    >
                                        {{ employee.name }}
                                        - {{ employee.designation }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Username -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                minlength="6"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Create Account
                        </button>

                    </form>


                    <div class="text-center mt-3">

                        <a
                            href="{{ url_for('dashboard') }}"
                            class="text-decoration-none"
                        >
                            ← Back to Dashboard
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
